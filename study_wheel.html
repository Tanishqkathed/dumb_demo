<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Decider Wheel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 10px; }
        
        #message-box {
            height: 40px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 30px;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff3e3e;
            z-index: 10;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        button:hover { background-color: #45a049; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #reset-btn {
            background-color: #ff9800;
            margin-top: 10px;
            display: none; /* Hidden by default */
        }
        
        .result-highlight {
            color: #2196F3;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>What should I study?</h1>
    <div id="message-box">Spin the wheel to decide!</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <div>
        <button id="spin-btn">SPIN</button>
        <br>
        <button id="reset-btn" onclick="resetToMain()">Back to Main Menu</button>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const resetBtn = document.getElementById('reset-btn');
        const messageBox = document.getElementById('message-box');

        // Configuration Data
        const mainTopics = [
            { label: "AI & ML", color: "#FF6384" },
            { label: "Data Science", color: "#36A2EB" },
            { label: "IELTS", color: "#FFCE56", isCategory: true, subOptions: "ielts" },
            { label: "Learn German", color: "#4BC0C0" },
            { label: "GRE", color: "#9966FF", isCategory: true, subOptions: "gre" }
        ];

        const ieltsTopics = [
            { label: "Speaking", color: "#FF9F40" },
            { label: "Listening", color: "#FFCD56" },
            { label: "Reading", color: "#4BC0C0" },
            { label: "Writing", color: "#36A2EB" }
        ];

        const greTopics = [
            { label: "English", color: "#9966FF" },
            { label: "Maths", color: "#FF6384" }
        ];

        // State variables
        let currentSegments = mainTopics;
        let currentRotation = 0;
        let isSpinning = false;

        // Draw the wheel based on currentSegments
        function drawWheel() {
            const arcSize = (2 * Math.PI) / currentSegments.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            currentSegments.forEach((segment, index) => {
                const angle = index * arcSize;
                
                // Draw Wedge
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.lineTo(centerX, centerY);
                ctx.fillStyle = segment.color;
                ctx.fill();
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 20px Arial";
                ctx.fillText(segment.label, radius - 20, 10);
                ctx.restore();
            });
        }

        // Handle the spinning logic
        function spin() {
            if (isSpinning) return;

            isSpinning = true;
            spinBtn.disabled = true;
            messageBox.innerText = "Spinning...";

            // Random rotation: At least 5 full spins (1800 deg) + random segment
            const randomDegree = Math.floor(Math.random() * 360) + 1800; 
            
            // Calculate total rotation
            currentRotation += randomDegree;

            // Apply CSS transform for smooth animation
            canvas.style.transform = `rotate(-${currentRotation}deg)`;

            // Wait for animation to finish (3 seconds matches CSS)
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                determineWinner(currentRotation);
            }, 3000);
        }

        function determineWinner(rotation) {
            const normalizedRotation = rotation % 360;
            const arcSizeDeg = 360 / currentSegments.length;
            
            // Because the pointer is at the TOP (270 degrees or -90), and we rotate counter-clockwise via CSS negative
            // We need to calculate which index is at the top.
            // The logic: (360 - (rotation % 360) + 90) % 360
            // Simplified logic: The top is 90 degrees offset from 0.
            
            // Let's use a simpler mapping method based on the visual result
            const index = Math.floor(((rotation % 360) + 90) % 360 / arcSizeDeg);
            
            // Because our drawing starts at 3 o'clock and goes clockwise:
            // The math above finds the correct index hitting the 12 o'clock pointer.
            // However, due to array ordering, we usually need to invert the index direction:
            const actualIndex = (currentSegments.length - 1) - index + (index >= currentSegments.length ? currentSegments.length : 0);
            
            // Fix edge case logic for specific rotation math
            // Actually, simplest way: Just calculate based on segments.
            // Let's rely on standard normalized calculation:
            const degreesRotated = rotation % 360;
            const segmentAngle = 360 / currentSegments.length;
            // Pointer is at 90deg (top). 
            // We need to find which segment spans across 90deg after rotation.
            // Since we rotated the canvas NEGATIVE (counter-clockwise), the values shift positive.
            let winningIndex = Math.floor(((degreesRotated + 90) % 360) / segmentAngle);
            
            // Invert index because canvas draws clockwise, but we calculated angle shifts
            winningIndex = (currentSegments.length - 1 - winningIndex + currentSegments.length) % currentSegments.length;

            const winner = currentSegments[winningIndex];
            handleResult(winner);
        }

        function handleResult(winner) {
            if (winner.isCategory) {
                // If they landed on IELTS or GRE
                messageBox.innerHTML = `You got ${winner.label}! <br> <span style="font-size:0.9rem">Loading sub-options... Spin again!</span>`;
                
                setTimeout(() => {
                    // Switch data
                    if (winner.subOptions === 'ielts') {
                        currentSegments = ieltsTopics;
                    } else if (winner.subOptions === 'gre') {
                        currentSegments = greTopics;
                    }
                    
                    // Reset rotation visual for new wheel
                    canvas.style.transition = 'none';
                    canvas.style.transform = 'rotate(0deg)';
                    currentRotation = 0;
                    
                    drawWheel();
                    resetBtn.style.display = "inline-block"; // Show back button
                    
                    // Restore transition for next spin
                    setTimeout(() => { canvas.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)'; }, 50);

                }, 1500);

            } else {
                // Final result
                messageBox.innerHTML = `Study Topic: <span class="result-highlight">${winner.label}</span>`;
                launchConfetti();
            }
        }

        function resetToMain() {
            currentSegments = mainTopics;
            canvas.style.transition = 'none';
            canvas.style.transform = 'rotate(0deg)';
            currentRotation = 0;
            drawWheel();
            resetBtn.style.display = "none";
            messageBox.innerText = "Spin the wheel to decide!";
            setTimeout(() => { canvas.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)'; }, 50);
        }

        function launchConfetti() {
            // Simple visual cue for winning
            document.body.style.backgroundColor = "#e8f5e9";
            setTimeout(() => { document.body.style.backgroundColor = "#f0f2f5"; }, 500);
        }

        // Init
        spinBtn.addEventListener('click', spin);
        drawWheel();

    </script>
</body>
</html>
